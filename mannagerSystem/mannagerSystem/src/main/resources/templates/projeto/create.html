<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${projeto.id == null ? 'DevWeb - Novo Projeto' : 'DevWeb - Editar Projeto'}">DevWeb - Projeto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/projetos}">
                <i class="bi bi-code-slash text-warning me-2"></i>DevWeb Manager
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active" th:href="@{/projetos}"><i class="bi bi-kanban me-1"></i>Projetos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/tecnologias}"><i class="bi bi-cpu me-1"></i>Tecnologias</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center text-white" sec:authorize="isAuthenticated()">
                    <span class="me-3 small">
                        <i class="bi bi-person-circle me-1"></i>
                        <span sec:authentication="name">Usuário</span>
                    </span>
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-outline-light btn-sm">
                            <i class="bi bi-box-arrow-right me-1"></i>Sair
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">

                <div class="mb-3">
                    <a th:href="@{/projetos}" class="text-decoration-none text-muted">
                        <i class="bi bi-arrow-left me-1"></i>Voltar para a lista de projetos
                    </a>
                </div>

                <div class="card border-0 shadow-sm rounded-3">
                    <div class="card-header bg-white border-bottom py-3">
                        <h4 class="mb-0 fw-bold text-secondary">
                            <i th:class="${projeto.id == null ? 'bi bi-plus-circle-fill text-primary me-2' : 'bi bi-pencil-square text-warning me-2'}"></i>
                            <span th:text="${projeto.id == null ? 'Cadastrar Novo Projeto' : 'Editar Projeto'}">Formulário de Projeto</span>
                        </h4>
                    </div>
                    
                    <div class="card-body p-4">

                        <div th:if="${mensagemErro}" class="alert alert-danger alert-dismissible fade show" role="alert">
                            <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${mensagemErro}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>

                        <form th:action="@{/projetos/salvar}" th:object="${projeto}" method="post">
                            
                            <input type="hidden" th:field="*{id}" />

                            <div class="mb-3">
                                <label for="titulo" class="form-label fw-semibold">Título do Projeto <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="titulo" th:field="*{titulo}" 
                                       placeholder="Ex: Sistema de Gestão Financeira" required maxlength="150" />
                                <div class="form-text">Informe um título claro e descritivo.</div>
                            </div>

                            <div class="mb-3">
                                <label for="descricao" class="form-label fw-semibold">Descrição</label>
                                <textarea class="form-control" id="descricao" th:field="*{descricao}" rows="4" 
                                          placeholder="Descreva o escopo, requisitos ou objetivos do projeto..."></textarea>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="status" class="form-label fw-semibold">Status do Projeto <span class="text-danger">*</span></label>
                                    <select class="form-select" id="status" th:field="*{status}" required>
                                        <option th:each="st : ${statusList}" 
                                                th:value="${st}" 
                                                th:text="${st.descricao}">Status</option>
                                    </select>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label for="orcamento" class="form-label fw-semibold">Orçamento (R$)</label>
                                    <div class="input-group">
                                        <span class="input-group-text">R$</span>
                                        <input type="number" step="0.01" min="0" class="form-control" id="orcamento" 
                                               th:field="*{orcamento}" placeholder="0,00" />
                                    </div>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="dataPrevisaoEntrega" class="form-label fw-semibold">Data Prevista de Entrega</label>
                                <input type="date" class="form-control" id="dataPrevisaoEntrega" th:field="*{dataPrevisaoEntrega}" />
                            </div>

                            <div class="d-flex justify-content-end gap-2 border-top pt-3">
                                <a th:href="@{/projetos}" class="btn btn-outline-secondary">
                                    <i class="bi bi-x-circle me-1"></i>Cancelar
                                </a>
                                <button type="submit" class="btn btn-primary px-4">
                                    <i class="bi bi-check2-circle me-1"></i>Salvar Projeto
                                </button>
                            </div>

                        </form>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
