<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${tecnologia.id == null ? 'DevWeb - Nova Tecnologia' : 'DevWeb - Editar Tecnologia'}">DevWeb - Tecnologia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/projetos}">
                <i class="bi bi-code-slash text-warning me-2"></i>DevWeb Manager
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/projetos}"><i class="bi bi-kanban me-1"></i>Projetos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" th:href="@{/tecnologias}"><i class="bi bi-cpu me-1"></i>Tecnologias</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center text-white" sec:authorize="isAuthenticated()">
                    <span class="me-3 small">
                        <i class="bi bi-person-circle me-1"></i>
                        <span sec:authentication="name">Usuário</span>
                    </span>
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-outline-light btn-sm">
                            <i class="bi bi-box-arrow-right me-1"></i>Sair
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-7">

                <div class="mb-3">
                    <a th:href="@{/tecnologias}" class="text-decoration-none text-muted">
                        <i class="bi bi-arrow-left me-1"></i>Voltar para a lista de tecnologias
                    </a>
                </div>

                <div class="card border-0 shadow-sm rounded-3">
                    <div class="card-header bg-white border-bottom py-3">
                        <h4 class="mb-0 fw-bold text-secondary">
                            <i th:class="${tecnologia.id == null ? 'bi bi-plus-circle-fill text-primary me-2' : 'bi bi-pencil-square text-warning me-2'}"></i>
                            <span th:text="${tecnologia.id == null ? 'Cadastrar Nova Tecnologia' : 'Editar Tecnologia'}">Formulário de Tecnologia</span>
                        </h4>
                    </div>
                    
                    <div class="card-body p-4">

                        <div th:if="${mensagemErro}" class="alert alert-danger alert-dismissible fade show" role="alert">
                            <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${mensagemErro}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>

                        <form th:action="@{/tecnologias/salvar}" th:object="${tecnologia}" method="post">
                            
                            <input type="hidden" th:field="*{id}" />

                            <div class="mb-3">
                                <label for="nome" class="form-label fw-semibold">Nome da Tecnologia <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="nome" th:field="*{nome}" 
                                       placeholder="Ex: React, Java, Spring Boot, PostgreSQL" required maxlength="100" />
                                <div class="form-text">O nome deve ser único e identificar claramente a tecnologia.</div>
                            </div>

                            <div class="mb-4">
                                <label for="categoria" class="form-label fw-semibold">Categoria</label>
                                <input type="text" class="form-control" id="categoria" th:field="*{categoria}" 
                                       placeholder="Ex: Frontend, Backend, Banco de Dados, DevOps, Mobile" maxlength="100"
                                       list="categoriaSugestoes" />
                                <datalist id="categoriaSugestoes">
                                    <option value="Frontend">
                                    <option value="Backend">
                                    <option value="Banco de Dados">
                                    <option value="DevOps / Cloud">
                                    <option value="Mobile">
                                    <option value="Testes / QA">
                                </datalist>
                                <div class="form-text">Classificação opcional da tecnologia.</div>
                            </div>

                            <div class="d-flex justify-content-end gap-2 border-top pt-3">
                                <a th:href="@{/tecnologias}" class="btn btn-outline-secondary">
                                    <i class="bi bi-x-circle me-1"></i>Cancelar
                                </a>
                                <button type="submit" class="btn btn-primary px-4">
                                    <i class="bi bi-check2-circle me-1"></i>Salvar Tecnologia
                                </button>
                            </div>

                        </form>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
