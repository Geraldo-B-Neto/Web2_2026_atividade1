<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"
                   xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<th:block th:replace="~{fragments/head :: head('Consultas')}"></th:block>
<body>
  <th:block th:replace="~{fragments/head :: header}"></th:block>
  <main class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1>Consultas</h1>
      <!-- Apenas GERENTE e ADMIN podem agendar -->
      <a sec:authorize="hasAnyAuthority('ROLE_GERENTE','ROLE_ADMIN')"
         th:href="@{/consultas/create}" class="btn btn-primary">Agendar consulta</a>
    </div>
    <table class="table table-striped">
      <thead>
        <tr>
          <th>Paciente</th>
          <th>Data e horário</th>
          <th>Motivo</th>
          <th>Status</th>
          <th>Valor</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody>
        <tr th:if="${#lists.isEmpty(consultas)}">
          <td colspan="6" class="text-center">Nenhuma consulta cadastrada.</td>
        </tr>
        <tr th:each="consulta : ${consultas}">
          <td th:text="${consulta.paciente.nome}"></td>
          <td th:text="${#temporals.format(consulta.dataHora, 'dd/MM/yyyy HH:mm')}"></td>
          <td th:text="${consulta.motivo}"></td>
          <td th:text="${consulta.status}"></td>
          <td th:text="${#numbers.formatCurrency(consulta.valor)}"></td>
          <td class="text-nowrap">
            <!-- Apenas GERENTE e ADMIN podem editar -->
            <a sec:authorize="hasAnyAuthority('ROLE_GERENTE','ROLE_ADMIN')"
               th:href="@{/consultas/edit/{id}(id=${consulta.id})}"
               class="btn btn-outline-primary btn-sm">Editar</a>
            <!-- Apenas ADMIN pode excluir -->
            <a sec:authorize="hasAuthority('ROLE_ADMIN')"
               th:href="@{/consultas/delete/{id}(id=${consulta.id})}"
               class="btn btn-outline-danger btn-sm"
               onclick="return confirm('Excluir esta consulta?');">Excluir</a>
          </td>
        </tr>
      </tbody>
    </table>
  </main>
</body>
</html>
