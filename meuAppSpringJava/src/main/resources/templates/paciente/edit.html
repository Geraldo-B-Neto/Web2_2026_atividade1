<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="ISO-8859-1" />
<title>Editar Pacientes</title>

<link
    rel="stylesheet"
    href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
    integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
    crossorigin="anonymous"
/>
</head>
<body>
<div class="container">
    <h1>Editar Pacientes</h1>
    <form action="#" th:action="@{/paciente/update/{id}(id=${paciente.id})}" th:object="${paciente}" method="POST">

        <!-- Campo necessário para que o save saiba que não estamos criando, mas editando um paciente -->
        <input type="hidden" th:field="*{id}" />

        <div class="form-group row">
            <label for="nome" class="col-sm-2 col-form-label">Nome</label>
            <div class="col-sm-10">
                <input type="text" th:field="*{nome}" class="form-control" id="nome" placeholder="Nome completo">
                <p th:if="${#fields.hasErrors('nome')}" th:errorclass="text-danger" th:errors="*{nome}"></p>
            </div>
        </div>
        <div class="form-group row">
            <label class="col-sm-2 col-form-label" for="dataNascimento">Data de nascimento</label>
            <div class="col-sm-10">
                <input type="date" th:field="*{dataNascimento}" class="form-control" id="dataNascimento">
                <p th:if="${#fields.hasErrors('dataNascimento')}" th:errorclass="text-danger" th:errors="*{dataNascimento}"></p>
            </div>
        </div>
        <div class="form-group row">
            <label class="col-sm-2 col-form-label" for="telefone">Telefone</label>
            <div class="col-sm-10">
                <input type="tel" th:field="*{telefone}" class="form-control" id="telefone" placeholder="(00) 00000-0000">
                <p th:if="${#fields.hasErrors('telefone')}" th:errorclass="text-danger" th:errors="*{telefone}"></p>
            </div>
        </div>
        <div class="form-group row">
            <label class="col-sm-2 col-form-label" for="email">E-mail</label>
            <div class="col-sm-10">
                <input type="email" th:field="*{email}" class="form-control" id="email" placeholder="paciente@email.com">
                <p th:if="${#fields.hasErrors('email')}" th:errorclass="text-danger" th:errors="*{email}"></p>
            </div>
        </div>
        <button type="submit" class="btn btn-info">Salvar alterações</button>
    </form>
</div>
</body>
</html>
