<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="ISO-8859-1" />
<title>Editar Pacientes</title>

<link
    rel="stylesheet"
    href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
    integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
    crossorigin="anonymous"
/>
</head>
<body>
<div class="container">
    <h1>Editar Pacientes</h1>
    <form action="#" th:action="@{/paciente/update/{id}(id=${paciente.id})}" th:object="${paciente}" method="POST">

        <!-- Campo necessário para que o save saiba que não estamos criando, mas editando um paciente -->
        <input type="hidden" th:field="*{id}" />

        <div class="form-group row">
            <label for="name" class="col-sm-2 col-form-label">Nome</label>
            <div class="col-sm-10">
                <input type="text" th:field="*{name}" class="form-control" id="name" name="name" placeholder="Digite o nome do paciente">
                <p th:if="${#fields.hasErrors('name')}" th:errorclass="text-danger" th:errors="*{name}"></p>
            </div>
        </div>
        <div class="form-group row">
            <label class="col-sm-2 col-form-label" for="description">Descrição:</label>
            <div class="col-sm-10">
                <textarea id="description" th:field="*{description}" class="form-control" name="description" rows="4" cols="50"></textarea>
            </div>
        </div>
        <div class="form-group row">
            <label class="col-sm-2 col-form-label" for="price">Preço:</label>
            <div class="col-sm-10">
                <input type="number" th:field="*{price}" class="form-control" id="price" name="price" step="0.01"
                    placeholder="Digite o preço do paciente" >
                <p th:if="${#fields.hasErrors('price')}" th:errorclass="text-danger" th:errors="*{price}"></p>
            </div>
        </div>
        <div class="form-group row">
            <label class="col-sm-2 col-form-label" for="stock">Estoque:</label>
            <div class="col-sm-10">
                <input type="number" th:field="*{stock}" class="form-control" id="stock" name="stock" min="0" step="1"
                    placeholder="Digite a quantidade em estoque">
                <p th:if="${#fields.hasErrors('stock')}" th:errorclass="text-danger" th:errors="*{stock}"></p>
            </div>
        </div>
        <button type="submit" class="btn btn-info col-2"> Editar Paciente</button>
    </form>
</div>
</body>
</html>
