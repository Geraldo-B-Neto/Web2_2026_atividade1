<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
  <th:block th:replace="~{fragments/head :: head('Pacientes')}"></th:block>
  <body>
    <th:block th:replace="~{fragments/head :: header}"></th:block>
    <main class="container mt-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>Pacientes</h1>
        <a th:href="@{/paciente/create}" class="btn btn-primary">Cadastrar paciente</a>
      </div>
      <table class="table table-striped">
        <thead>
          <tr>
            <th>Nome</th>
            <th>Data de nascimento</th>
            <th>Telefone</th>
            <th>E-mail</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody>
          <tr th:if="${#lists.isEmpty(pacientesList)}">
            <td colspan="5" class="text-center">Nenhum paciente cadastrado.</td>
          </tr>
          <tr th:each="paciente : ${pacientesList}">
            <td th:text="${paciente.nome}"></td>
            <td th:text="${#temporals.format(paciente.dataNascimento, 'dd/MM/yyyy')}"></td>
            <td th:text="${paciente.telefone}"></td>
            <td th:text="${paciente.email}"></td>
            <td class="text-nowrap">
              <a th:href="@{/paciente/edit/{id}(id=${paciente.id})}" class="btn btn-outline-primary btn-sm">Editar</a>
              <a th:href="@{/paciente/delete/{id}(id=${paciente.id})}" class="btn btn-outline-danger btn-sm"
                 onclick="return confirm('Excluir este paciente?');">Excluir</a>
            </td>
          </tr>
        </tbody>
      </table>
    </main>
  </body>
</html>
