<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="ISO-8859-1" />
    <title>Listagem de Produtos</title>

    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
      integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
      crossorigin="anonymous"
    />
  </head>
  <body>
     <div class="container pt-5">
      <a th:href="@{/paciente/create}">Cadastrar Paciente</a>
      <h1>Listagem de Paciente</h1>
      <table class="table table-striped">
        <thead>
          <tr>
            <th scope="col">Nome</th>
            <th scope="col">Descrição</th>
            <th scope="col">Preço</th>
            <th scope="col">Estoque</th>
            <th scope="col">Excluir</th>
            <th scope="col">Editar</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="paciente : ${pacientesList}">
            <td scope="row" th:text="${paciente.name}"></td>
            <td scope="row" th:text="${paciente.description}"></td>
            <td scope="row" th:text="${paciente.price}"></td>
            <td scope="row" th:text="${paciente.stock}"></td>
            <td scope="row">
              <a th:href="@{/paciente/delete/{id}(id=${paciente.id})}" class="btn btn-danger">Deletar</a>
            </td>
             <td>
              <a th:href="@{/paciente/edit/{id}(id=${paciente.id})}">Editar</a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </body>
</html>
