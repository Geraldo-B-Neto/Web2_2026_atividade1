<head th:fragment="head(title)">
  <meta charset="ISO-8859-1" />
  <title th:text="${title}"></title>

  <link
    rel="stylesheet"
    href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
    integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
    crossorigin="anonymous"
  />
  <script
    src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
    integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
    crossorigin="anonymous"
  ></script>
  <script
    src="https://cdn.jsdelivr.net/npm/popper.js@1.14.3/dist/umd/popper.min.js"
    integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49"
    crossorigin="anonymous"
  ></script>
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/js/bootstrap.min.js"
    integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy"
    crossorigin="anonymous"
  ></script>
  <link rel="stylesheet" th:href="@{/css/custom.css}"/>
</head>

<nav
  th:fragment="header()"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
  class="container-fluid navbar navbar-expand-lg navbar-dark bg-dark"
>
  <div class="container">
    <button
      class="navbar-toggler"
      type="button"
      data-toggle="collapse"
      data-target="#navbarSupportedContent"
      aria-controls="navbarSupportedContent"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav mr-auto">

        <!-- Menu Pacientes -->
        <li class="nav-item dropdown active">
          <a class="nav-link dropdown-toggle" href="#"
             id="dropdownPaciente" role="button"
             data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
            Pacientes
          </a>
          <div class="dropdown-menu" aria-labelledby="dropdownPaciente">
            <a class="dropdown-item" th:href="@{/paciente}">Listar pacientes</a>
            <!-- Cadastrar: apenas GERENTE e ADMIN -->
            <a sec:authorize="hasAnyAuthority('ROLE_GERENTE','ROLE_ADMIN')"
               class="dropdown-item" th:href="@{/paciente/create}">Cadastrar paciente</a>
          </div>
        </li>

        <!-- Menu Consultas -->
        <li class="nav-item dropdown active">
          <a class="nav-link dropdown-toggle" href="#"
             id="dropdownConsulta" role="button"
             data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
            Consultas
          </a>
          <div class="dropdown-menu" aria-labelledby="dropdownConsulta">
            <a class="dropdown-item" th:href="@{/consultas}">Listar consultas</a>
            <!-- Agendar: apenas GERENTE e ADMIN -->
            <a sec:authorize="hasAnyAuthority('ROLE_GERENTE','ROLE_ADMIN')"
               class="dropdown-item" th:href="@{/consultas/create}">Agendar consulta</a>
          </div>
        </li>

      </ul>

      <!-- Exibe o perfil do usuário logado -->
      <span sec:authorize="isAuthenticated()" class="navbar-text text-light mr-3">
        Olá, <strong sec:authentication="name"></strong>
        <span sec:authorize="hasAuthority('ROLE_ADMIN')" class="badge badge-danger ml-1">Admin</span>
        <span sec:authorize="hasAuthority('ROLE_GERENTE')" class="badge badge-warning ml-1">Gerente</span>
        <span sec:authorize="hasAuthority('ROLE_USER')" class="badge badge-secondary ml-1">Usuário</span>
      </span>

      <a sec:authorize="isAnonymous()" th:href="@{/login}" class="btn btn-outline-light mr-2">Entrar</a>
      <a sec:authorize="isAnonymous()" th:href="@{/register}" class="btn btn-light mr-2">Criar conta</a>
      <form sec:authorize="isAuthenticated()" class="form-inline my-2 my-lg-0" th:action="@{/logout}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <button type="submit" class="btn btn-outline-light">Sair</button>
      </form>
    </div>
  </div>
</nav>
