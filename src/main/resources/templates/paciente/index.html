<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <th:block th:replace="~{Fragments/head :: head('Listar Paciente')}"></th:block>
  <body>
    <th:block th:replace="~{Fragments/head :: header}"></th:block>
    <div class="container">
      <h1>Listagem de Paciente</h1>
      <table class="table table-striped">
        <thead>
          <tr>
            <th scope="col">Nome</th>
            <th scope="col">Descrição</th>
            <th scope="col">Preço</th>
            <th scope="col">Estoque</th>
            <th scope="col">Editar</th>
            <th scope="col">Excluir</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="paciente : ${pacientesList}">
            <td scope="row" th:text="${paciente.name}"></td>
            <td scope="row" th:text="${paciente.description}"></td>
            <td scope="row" th:text="${paciente.price}"></td>
            <td scope="row" th:text="${paciente.stock}"></td>
            <td scope="row">
              <a th:href="@{/paciente/edit/{id}(id=${paciente.id})}">Editar</a>
            </td>
            <td>
              <a th:href="@{/paciente/delete/{id}(id=${paciente.id})}">Deletar</a>
            </td>
          </tr>
        </tbody>
      </table>

      <div class="row">
        <a th:href="@{/paciente/create}">
          <button class="btn btn-primary">Cadastrar Paciente</button>
        </a>
      </div>
    </div>
    <th:block th:replace="~{Fragments/footer :: footer}"></th:block>
  </body>
</html>
